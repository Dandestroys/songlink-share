name: debug

on:
  push:
    branches: [ "debug"]
  pull_request:
    branches: [ "debug" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=8.9

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > $GITHUB_WORKSPACE/app/debug-ci.keystore

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_FILE: ${{ github.workspace }}/app/debug-ci.keystore
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk songlink-share-latest.apk

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug --yes --cleanup-tag 2>/dev/null || true
          sleep 5
          gh release create debug \
            --title "Songlink Share — Latest Build" \
            --notes "### Install
          1. Download \`songlink-share-latest.apk\` below.
          2. Transfer it to your Android phone (AirDrop, email, USB, etc.).
          3. Open the file on the phone — allow **Install from unknown sources** if prompted.
          4. Share any song from Spotify, YouTube Music, or Apple Music and pick **Songlink Share** from the share sheet.

          ---
          Built from commit \`${{ github.sha }}\`" \
            --prerelease \
            songlink-share-latest.apk
