name: release

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=8.9

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk songlink-share-latest.apk

      - name: Get actual checked out commit
        if: github.event_name != 'pull_request'
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Write release notes
        if: github.event_name != 'pull_request'
        run: |
          cat > release-notes.md <<EOF
          ### Install
          1. Download \`songlink-share-latest.apk\` below.
          2. Transfer it to your Android phone (AirDrop, email, USB, etc.).
          3. Open the file on the phone and allow Install from unknown sources if prompted.
          4. Share any song from Spotify, YouTube Music, or Apple Music and pick Songlink Share from the share sheet.

          ---
          Built from branch \`release\`
          Built from commit \`${BUILD_SHA}\`
          EOF

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh release create release songlink-share-latest.apk \
            --title "Songlink Share — Latest release" \
            --notes-file release-notes.md
