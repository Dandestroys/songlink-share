on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=8.9

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk songlink-share-latest.apk

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          sleep 5
          gh release create latest \
            --title "Songlink Share — Latest Build" \
            --notes "### Install
          1. Download \`songlink-share-latest.apk\` below.
          2. Transfer it to your Android phone (AirDrop, email, USB, etc.).
          3. Open the file on the phone — allow **Install from unknown sources** if prompted.
          4. Share any song from Spotify, YouTube Music, or Apple Music and pick **Songlink Share** from the share sheet.

          ---
          Built from commit \`${{ github.sha }}\`" \
            --prerelease \
            songlink-share-latest.apk
